# Loopback - start/stop with loopback-up.cmd / loopback-down.cmd (they also manage the
# host-side Claude bridge, which cannot run in a container). UI: http://localhost:3000
name: loopback

services:
  server:
    build:
      context: .
      dockerfile: ./src/Server/Dockerfile
    restart: unless-stopped
    # All settings incl. secrets (gitignored; template .env.example)
    env_file: .env
    environment:
      LOOPBACK_WORKFLOWS: /config/workflows
      LOOPBACK_DATA: /data
      LOOPBACK_OUTPUT: /output
    volumes:
      # Prompt folders (natures), read-only
      - ./workflows:/config/workflows:ro
      # SQLite database (holds the Plaud session - treat as sensitive). A named volume, not a
      # bind mount: SQLite's WAL locking does not work across Docker Desktop's VM boundary, and
      # touching the file from Windows while the server runs corrupts it. Inspect it with
      # `docker compose exec server ...` or copy it out with `docker compose cp server:/data/loopback.db .`
      - loopback-data:/data
      # Result JSON files - point the left side elsewhere (e.g. an Obsidian inbox) to file them there
      - ./output:/output
    # The backend is reached only through the web container (BFF); claude-bridge.fsx on the
    # host is reached via host.docker.internal (provided by Docker Desktop).

  web:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://server:8080
    depends_on:
      - server

volumes:
  loopback-data:
